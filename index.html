<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhbarul Hadi</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --term-green: #00ff41;
            --term-dim: #008F11;
            --term-white: #e0e0e0;
            --font-stack: 'Fira Code', monospace;
            --scan-line: rgba(18, 16, 16, 0.5); 
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: var(--font-stack);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
            display: flex;
            flex-direction: column;
        }

        /* CRT Scanline Overlay Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Main Layout */
        #terminal-container {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--term-dim); border: 1px solid var(--term-green); }

        /* Typography & Utilities */
        a { color: var(--term-white); text-decoration: underline; cursor: pointer; }
        a:hover { background-color: var(--term-green); color: var(--bg-color); text-decoration: none; }
        .highlight { color: var(--term-white); font-weight: bold; }
        .dim { color: var(--term-dim); }
        .error { color: #ff3333; }
        .warning { color: #ffb703; }
        
        /* Navbar Command Style */
        .nav-bar {
            border-bottom: 1px solid var(--term-dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-bar span {
            color: var(--term-green);
        }
        .nav-cmd {
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-cmd:before { content: "> "; color: var(--term-dim); }
        .nav-cmd:hover { text-shadow: 0 0 8px var(--term-green); transform: translateX(5px); }

        /* Input Area */
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .prompt { margin-right: 10px; color: var(--term-green); }
        #cmd-input {
            background: transparent;
            border: none;
            color: var(--term-white);
            font-family: var(--font-stack);
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
            caret-color: var(--term-green);
        }

        /* Blinking Cursor (Custom) */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--term-green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Output Formatting */
        .output-section { margin-bottom: 20px; line-height: 1.6; }
        .ascii-art { white-space: pre; font-size: 0.8rem; line-height: 1; color: var(--term-dim); margin-bottom: 20px;}
        
        /* Skill Bars */
        .skill-row { display: flex; align-items: center; margin-bottom: 5px; }
        .skill-name { width: 120px; }
        .skill-bar { color: var(--term-white); }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div id="history"></div>
        <div class="input-line">
            <span class="prompt">visitor@portfolio:~$</span>
            <input type="text" id="cmd-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const config = {
            username: "hadi",
            hostname: "polibatam-dev",
            bootText: [
                "Initializing System Core...",
                "Access granted. Welcome, Akhbarul Hadi."
            ],
            commands: {
                home: {
                    desc: "Main Homepage",
                    content: `
<div class="ascii-art">
  _    _        _ _ 
 | |  | |      | (_)
 | |__| | __ _ | |_ 
 |  __  |/ _' || | |
 | |  | | (_| || | |
 |_|  |_|\\__,_||_|_|
</div>
Hi! I'm <span class="highlight">Akhbarul Hadi</span>.
I'm a university student majoring in Informatics, specializing in Software Engineering. I often work on various projects as a programmer, where I enjoy solving problems, building applications, and honing my technical skills. I'm passionate about learning new technologies and contributing to innovative projects.

<div class="nav-bar">
    <span class="nav-cmd" onclick="exec('about')">./about</span>
    <span class="nav-cmd" onclick="exec('skills')">./skills</span>
    <span class="nav-cmd" onclick="exec('projects')">./projects</span>
    <span class="nav-cmd" onclick="exec('contact')">./contact</span>
    <span class="nav-cmd" onclick="exec('help')">./help</span>
</div>
`
                },
                about: {
                    desc: "Professional Profile",
                    content: `<span class="warning">[UPDATE_REQUIRED]</span> <span class="highlight">status: 404_COMING_SOON</span><br><span class="dim">The profile module '/bio/profile.md' is currently undergoing system maintenance. Please check back later.</span>`
                },
                skills: {
                    desc: "Tech Stack Matrix",
                    content: `<span class="warning">[DEPLOYMENT_PENDING]</span> <span class="highlight">status: FEATURE_COMING_SOON</span><br><span class="dim">Technical capability matrix is being recalculated by the core system. Pipeline is inactive.</span>`
                },
                projects: {
                    desc: "Project Repository",
                    content: `<span class="warning">[DEPLOYMENT_PENDING]</span> <span class="highlight">status: PROJECTS_COMING_SOON</span><br><span class="dim">The manufacturing repository list is being archived and configured for public migration.</span>`
                },
                contact: {
                    desc: "Secure Contact Channel",
                    content: `<span class="warning">[DEPLOYMENT_PENDING]</span> <span class="highlight">status: GATEWAY_COMING_SOON</span><br><span class="dim">External secure communication channel is being configured. Firewall is temporarily blocking connections.</span>`
                },
                help: {
                    desc: "List available commands",
                    render: () => {
                        let html = '<span class="dim">The system recognizes the following commands:</span><br><br>';
                        Object.keys(config.commands).forEach(cmd => {
                            html += `<span class="highlight">${cmd.padEnd(10)}</span> - ${config.commands[cmd].desc}<br>`;
                        });
                        html += `<span class="highlight">${'clear'.padEnd(10)}</span> - Clear terminal screen`;
                        return html;
                    }
                }
            }
        };

        const historyDiv = document.getElementById('history');
        const cmdInput = document.getElementById('cmd-input');
        const terminalContainer = document.getElementById('terminal-container');

        // --- UTILITY FUNCTIONS ---
        function typeWriter(text, element, speed = 20) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        terminalContainer.scrollTop = terminalContainer.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function addToHistory(html, isCommand = false) {
            const div = document.createElement('div');
            div.className = 'output-section';
            if(isCommand) {
                div.innerHTML = `<span class="dim">${config.username}@${config.hostname}:~$</span> ${html}`;
            } else {
                div.innerHTML = html;
            }
            historyDiv.appendChild(div);
            terminalContainer.scrollTop = terminalContainer.scrollHeight;
        }

        // --- CORE LOGIC ---
        async function exec(cmdRaw) {
            const cmd = cmdRaw.toLowerCase().trim();
            
            addToHistory(cmd, true);

            if (cmd === '') return;

            if (cmd === 'clear') {
                historyDiv.innerHTML = '';
                return;
            }

            if (config.commands[cmd]) {
                const commandObj = config.commands[cmd];
                let content = '';

                if (commandObj.render) {
                    content = commandObj.render();
                } else {
                    content = commandObj.content;
                }

                const responseDiv = document.createElement('div');
                responseDiv.className = 'output-section';
                historyDiv.appendChild(responseDiv);
                
                responseDiv.innerHTML = content;
                
            } else {
                addToHistory(`<span class="error">bash: ${cmd}: command not found</span>`);
            }
            
            terminalContainer.scrollTop = terminalContainer.scrollHeight;
            cmdInput.value = '';
            cmdInput.focus();
        }

        // Boot Sequence
        async function boot() {
            cmdInput.style.display = 'none';
            const bootDiv = document.createElement('div');
            historyDiv.appendChild(bootDiv);

            for (let line of config.bootText) {
                const p = document.createElement('div');
                bootDiv.appendChild(p);
                await typeWriter(line, p, 10);
                await new Promise(r => setTimeout(r, 100));
            }
            
            historyDiv.appendChild(document.createElement('br'));
            
            exec('home');
            
            cmdInput.style.display = 'block';
            cmdInput.focus();
        }

        // --- EVENT LISTENERS ---

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                exec(this.value);
                this.value = '';
            }
        });

        document.addEventListener('click', (e) => {
            if (window.getSelection().toString() === '') {
                cmdInput.focus();
            }
        });

        window.onload = boot;
    </script>
</body>
</html>
