<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Tanda Tangan Elektronik (TTE)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border-top: 6px solid #3dcd58;
        }
        .header {
            background: linear-gradient(135deg, #3dcd58, #2ca944);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .header .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .header .logo span {
            background: #ffffff;
            color: #3dcd58; /* Teks hijau di dalam kotak putih */
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 800;
        }
        .header p {
            font-size: 14px;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }
        .status-badge {
            background-color: #e6f7eb;
            color: #2ca944;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #d0f0da;
        }
        .status-badge::before {
            content: "✓";
            font-weight: bold;
        }
        .content {
            padding: 30px 25px;
        }
        .info-group {
            margin-bottom: 25px;
        }
        .info-group:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666666;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .value {
            font-size: 16px;
            color: #222222;
            font-weight: 500;
        }
        .value.highlight {
            font-size: 19px;
            font-weight: 700;
            color: #2ca944;
        }
        .footer {
            background-color: #fafafa;
            padding: 18px 20px;
            text-align: center;
            font-size: 12px;
            color: #777777;
            border-top: 1px solid #eeeeee;
            line-height: 1.5;
        }
        .footer a {
            color: #2ca944;
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo"><span>Polibatam</span></div>
            <p>Sistem Verifikasi Dokumen Digital</p>
        </div>
        
        <div class="status-badge">
            Dokumen Terverifikasi Secara Digital (TTE)
        </div>

        <div class="content">
            <div class="info-group">
                <div class="label">Penandatangan (TTE oleh)</div>
                <div class="value highlight">Akhbarul Hadi</div>
            </div>

            <div class="info-group">
                <div class="label">Tanggal Ditandatangani</div>
                <div class="value">06 Juni 2025</div>
            </div>

            <div class="info-group">
                <div class="label">Perihal</div>
                <div class="value">ACC Laporan Magang</div>
            </div>
            
            <!-- <div class="info-group">
                <div class="label">Jenis Verifikasi</div>
                <div class="value" style="color: #2ca944; font-weight: 600;">Kode QR Resmi Korporat</div>
            </div> -->
        </div>

        <div class="footer">
            Pastikan URL di https://akhbarulhadi.github.io/sign/approve
        </div>
    </div>

</body>
</html>
